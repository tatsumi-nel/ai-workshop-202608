[project]
name = "gesture-arena"
version = "0.1.0"
description = "手のジェスチャーで操作するローカル画像認識ゲーム"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.21,<0.11",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.11,<5",
    "pygame>=2.6.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
